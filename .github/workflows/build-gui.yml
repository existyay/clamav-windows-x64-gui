name: Build ClamAV GUI

concurrency:
  group: build-gui-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish the rolling "latest" release'
        required: false
        default: true
        type: boolean

# The build job runs third-party tooling -- vcpkg ports, CMake, and a YAMAGoya
# archive downloaded from the internet -- so it must not hold a token that can
# write to the repository. Publishing needs write access, and is therefore
# confined to the 'publish' job below, which only runs GitHub's own actions
# and PowerShell.
permissions:
  contents: read

env:
  # The project publishes exactly one release, under this single tag. Every run
  # moves the tag and replaces the release, so the Releases page never grows
  # again. The prune step below also deletes anything left over from the old
  # per-version scheme (v1.0.x tags and their releases).
  RELEASE_TAG: latest

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          # The version is used for naming and display only. It is deliberately
          # not bumped and committed any more: the release tag is fixed, so the
          # per-run version commit only added merge noise to main.
          $cargoToml = Get-Content "gui\Cargo.toml" -Raw
          if ($cargoToml -match 'version = "([^"]+)"') {
            $version = $matches[1]
          } else {
            $version = "0.0.0"
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "build=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version (published under the fixed tag '$env:RELEASE_TAG')"
        shell: pwsh

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg_installed
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-

      - name: Cache ClamAV install
        id: clamav_install_cache
        uses: actions/cache@v4
        with:
          path: build/install
          key: clamav-install-x64-${{ hashFiles('CMakeLists.txt', 'CMakeOptions.cmake', 'vcpkg.json', 'cmake/**', 'clamd/**', 'clamscan/**', 'freshclam/**', 'libclamav/**', 'libfreshclam/**') }}
          restore-keys: clamav-install-x64-

      - name: Install vcpkg dependencies (retry)
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgExe = "$env:VCPKG_ROOT\vcpkg.exe"
          $maxAttempts = 5

          # These settings are harmless for normal cases and can improve stability
          # on flaky CI networks/proxies.
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "vcpkg install attempt $attempt/$maxAttempts"

            & $vcpkgExe install --triplet x64-windows
            if ($LASTEXITCODE -eq 0) {
              Write-Host "vcpkg install succeeded"
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "vcpkg install failed after $maxAttempts attempts"
            }

            Write-Host "::warning::vcpkg install failed. Cleaning registry cache and retrying..."
            $registryGitCache = Join-Path $env:LOCALAPPDATA "vcpkg\registries\git"
            if (Test-Path $registryGitCache) {
              Remove-Item $registryGitCache -Recurse -Force -ErrorAction SilentlyContinue
            }

            $sleepSeconds = [Math]::Min(60, [int]([Math]::Pow(2, $attempt) * 5))
            Write-Host "Sleeping $sleepSeconds seconds before retry"
            Start-Sleep -Seconds $sleepSeconds
          }
        shell: pwsh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gui -> target

      - name: Configure ClamAV (CMake)
        if: steps.clamav_install_cache.outputs.cache-hit != 'true'
        run: |
          mkdir build -ErrorAction SilentlyContinue
          cd build
          cmake .. -A x64 `
            -D CMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -D CMAKE_INSTALL_PREFIX="install" `
            -D ENABLE_TESTS=OFF `
            -D ENABLE_MILTER=OFF `
            -D ENABLE_EXAMPLES=OFF `
            -D ENABLE_MAN_PAGES=OFF `
            -D ENABLE_DOXYGEN=OFF

      - name: Build ClamAV
        if: steps.clamav_install_cache.outputs.cache-hit != 'true'
        run: |
          cd build
          cmake --build . --config Release --parallel
          cmake --build . --config Release --target install --parallel

      - name: Reuse cached ClamAV binaries
        if: steps.clamav_install_cache.outputs.cache-hit == 'true'
        run: |
          Write-Host "Using cached build/install (skipping CMake configure+build)."

      - name: Stage the CJK font
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Path gui\fonts -Force | Out-Null

          # Noto Sans SC is licensed under the SIL Open Font License and may be
          # redistributed. Do NOT copy from $env:SystemRoot\Fonts here: those
          # files (msyh.ttc, simsun.ttc, malgun.ttf) are proprietary Microsoft
          # fonts and packing one into a release is a licence violation. An
          # earlier version of this workflow did exactly that, saving the result
          # under a "NotoSansSC-Regular.ttf" name even though it was a TrueType
          # collection.
          #
          # The application renders Chinese with the Windows system font when no
          # bundled font is present, so this download is an optional extra for
          # systems that have had their CJK fonts removed.
          $dest = "gui\fonts\NotoSansSC-Regular.otf"
          try {
            Invoke-WebRequest -Uri 'https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansSC-Regular.otf' -OutFile $dest -UseBasicParsing
            $mb = [math]::Round((Get-Item $dest).Length / 1MB, 1)
            Write-Host "Noto Sans SC staged: $dest ($mb MB)"
          } catch {
            Write-Host "::warning::Could not download Noto Sans SC; the app will use the Windows system CJK font."
          }
        shell: pwsh

      - name: Embed ClamAV binaries into GUI
        run: |
          $clamavInstall = "build\install"
          $embedDir = "gui\embed\clamav"

          New-Item -ItemType Directory -Path $embedDir -Force | Out-Null

          # Copy executables
          $exes = @("clamscan.exe","freshclam.exe","clamd.exe","clamdscan.exe")
          foreach ($exe in $exes) {
            $src = "$clamavInstall\$exe"
            if (Test-Path $src) {
              Copy-Item $src "$embedDir\$exe"
              Write-Host "Embedded: $exe"
            }
          }

          # Copy DLLs
          Get-ChildItem "$clamavInstall\*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$embedDir\$($_.Name)"
            Write-Host "Embedded: $($_.Name)"
          }

          Write-Host "Embedded files:"
          Get-ChildItem $embedDir | Format-Table Name, Length -AutoSize
        shell: pwsh

      - name: Download and embed YAMAGoya
        run: |
          $yamaDir = "gui\embed\yamagoya"
          New-Item -ItemType Directory -Path $yamaDir -Force | Out-Null
          New-Item -ItemType Directory -Path "$yamaDir\amd64" -Force | Out-Null
          New-Item -ItemType Directory -Path "$yamaDir\rules" -Force | Out-Null

          $ProgressPreference = 'SilentlyContinue'
          $zipUrl = "https://github.com/JPCERTCC/YAMAGoya/releases/download/v1.0.0/YAMAGoya.v1.0.0.x64.zip"
          $zipPath = "$yamaDir\yamagoya.zip"

          # This asset is ~75 MB from GitHub's release CDN. The default 100 second
          # request timeout and the lack of a retry meant one slow or dropped
          # transfer failed the whole build, half an hour in, with nothing to show
          # for it.
          $downloaded = $false
          foreach ($attempt in 1..3) {
            try {
              Write-Host "Downloading YAMAGoya v1.0.0 (attempt $attempt)..."
              Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing -TimeoutSec 900
              $downloaded = $true
              break
            } catch {
              Write-Host "  attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
            }
          }
          if (-not $downloaded) {
            throw "无法下载 YAMAGoya（已重试 3 次）：$zipUrl"
          }

          Write-Host "Extracting YAMAGoya..."
          Expand-Archive -Path $zipPath -DestinationPath "$yamaDir\tmp" -Force

          # Move all files from extracted to embed dir
          Get-ChildItem "$yamaDir\tmp" -File | Move-Item -Destination $yamaDir -Force
          if (Test-Path "$yamaDir\tmp\amd64") {
            Get-ChildItem "$yamaDir\tmp\amd64" -File | Move-Item -Destination "$yamaDir\amd64" -Force
          }

          # Clean up
          Remove-Item $zipPath -Force
          Remove-Item "$yamaDir\tmp" -Recurse -Force
          Remove-Item "$yamaDir\install.bat" -Force -ErrorAction SilentlyContinue

          # Rules should already exist from repo checkout (gui/embed/yamagoya/rules/)
          # If not, download from GitHub
          if (-not (Test-Path "$yamaDir\rules\*.yml")) {
            $ruleFiles = @(
              "detect_invoke-sharploader.yml",
              "detect_lsass_dump.yml",
              "detect_malware_sample.yml",
              "detect_ransomeware_using_decoy.yml",
              "detect_wmi_activity.yml"
            )
            foreach ($f in $ruleFiles) {
              $ruleUrl = "https://raw.githubusercontent.com/JPCERTCC/YAMAGoya/main/rules/$f"
              $got = $false
              foreach ($attempt in 1..3) {
                try {
                  Invoke-WebRequest -Uri $ruleUrl -OutFile "$yamaDir\rules\$f" -UseBasicParsing -TimeoutSec 120
                  $got = $true
                  break
                } catch {
                  Write-Host "  $f attempt $attempt failed: $($_.Exception.Message)"
                  if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
                }
              }
              if (-not $got) { throw "无法下载规则文件：$ruleUrl" }
              Write-Host "Downloaded rule: $f"
            }
          }

          Write-Host "YAMAGoya embedded files:"
          Get-ChildItem $yamaDir -Recurse -File | ForEach-Object {
            $sizeMB = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name) ($sizeMB MB)"
          }
        shell: pwsh

      - name: Build GUI
        run: |
          cd gui
          cargo build --release
        env:
          OPENSSL_DIR: ${{ github.workspace }}\vcpkg_installed\x64-windows
          OPENSSL_LIB_DIR: ${{ github.workspace }}\vcpkg_installed\x64-windows\lib
          OPENSSL_INCLUDE_DIR: ${{ github.workspace }}\vcpkg_installed\x64-windows\include

      - name: Generate build info
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $buildTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $commitHash = git rev-parse --short HEAD

          New-Item -ItemType Directory -Path "dist" -Force | Out-Null

          @"
          Version: $version
          Release tag: $env:RELEASE_TAG
          Build number: $env:GITHUB_RUN_NUMBER
          Build Time: $buildTime
          Commit: $commitHash
          "@ | Set-Content "dist\BUILD_INFO.txt"

          Write-Host "Build info created"
        shell: pwsh

      - name: Package portable distribution
        run: |
          $outputDir = "dist\ClamAV-GUI-Portable"
          $clamavInstall = "build\install"
          $guiExe = "gui\target\release\clamav-gui.exe"

          if (-not (Test-Path $guiExe)) {
            Write-Error "Missing GUI executable: $guiExe. Ensure 'Build GUI' step completed successfully."
            exit 1
          }

          # Create directories
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\clamav" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\clamav\database" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\clamav\certs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\quarantine" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\logs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\yamagoya" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\yamagoya\rules" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\yamagoya\amd64" -Force | Out-Null
          New-Item -ItemType Directory -Path "$outputDir\fonts" -Force | Out-Null

          # Copy GUI
          Copy-Item $guiExe "$outputDir\ClamAV-Scanner.exe"

          # Bundle the OFL CJK font next to the executable. The GUI looks for a
          # `fonts\` folder beside itself before falling back to the Windows
          # system CJK font.
          if (Test-Path "gui\fonts") {
            Get-ChildItem "gui\fonts\*.otf","gui\fonts\*.ttf","gui\fonts\*.ttc" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "$outputDir\fonts\$($_.Name)"
              Write-Host "Bundled font: $($_.Name)"
            }
          }

          # Copy ClamAV executables
          $exes = @("clamscan.exe","freshclam.exe","clamd.exe","clamdscan.exe")
          foreach ($exe in $exes) {
            $src = "$clamavInstall\$exe"
            if (Test-Path $src) { Copy-Item $src "$outputDir\clamav\$exe" }
          }

          # Copy DLLs
          Get-ChildItem "$clamavInstall\*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$outputDir\clamav\$($_.Name)"
          }

          # Copy certs
          Copy-Item "$clamavInstall\certs\*" "$outputDir\clamav\certs\" -Recurse -ErrorAction SilentlyContinue

          # Copy YAMAGoya
          $yamaEmbed = "gui\embed\yamagoya"
          if (Test-Path "$yamaEmbed\YAMAGoya.exe") {
            Get-ChildItem "$yamaEmbed\*.exe","$yamaEmbed\*.dll" | ForEach-Object {
              Copy-Item $_.FullName "$outputDir\yamagoya\$($_.Name)"
            }
            if (Test-Path "$yamaEmbed\amd64") {
              Get-ChildItem "$yamaEmbed\amd64\*.dll" | ForEach-Object {
                Copy-Item $_.FullName "$outputDir\yamagoya\amd64\$($_.Name)"
              }
            }
            Get-ChildItem "$yamaEmbed\rules\*.yml" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "$outputDir\yamagoya\rules\$($_.Name)"
            }
            Write-Host "YAMAGoya copied to portable package"
          } else {
            Write-Host "::warning::YAMAGoya.exe not found, skipping YAMAGoya in portable package"
          }

          # Config files
          @"
          DatabaseMirror database.clamav.net
          Foreground yes
          MaxAttempts 3
          ConnectTimeout 30
          "@ | Set-Content "$outputDir\clamav\freshclam.conf"

          @"
          TCPSocket 3310
          TCPAddr 127.0.0.1
          Foreground yes
          MaxThreads 4
          "@ | Set-Content "$outputDir\clamav\clamd.conf"

          # License
          if (Test-Path "$clamavInstall\COPYING.txt") {
            Copy-Item "$clamavInstall\COPYING.txt" "$outputDir\LICENSE.txt"
          }
          if (Test-Path "$clamavInstall\COPYING") {
            Copy-Item "$clamavInstall\COPYING" "$outputDir\COPYING" -Recurse
          }

          # Create ZIP (portable distribution with separate files)
          Compress-Archive -Path "$outputDir\*" -DestinationPath "dist\ClamAV-GUI-Portable-x64.zip" -CompressionLevel Optimal

          # Copy standalone exe (all-in-one with embedded binaries)
          Copy-Item $guiExe "dist\ClamAV-Scanner-Standalone-x64.exe"

          $zipSize = [math]::Round((Get-Item "dist\ClamAV-GUI-Portable-x64.zip").Length / 1MB, 1)
          $exeSize = [math]::Round((Get-Item "dist\ClamAV-Scanner-Standalone-x64.exe").Length / 1MB, 1)
          Write-Host "Portable package: $zipSize MB"
          Write-Host "Standalone exe:   $exeSize MB"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClamAV-GUI-Portable-x64-${{ steps.version.outputs.version }}
          path: dist/ClamAV-GUI-Portable-x64.zip

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClamAV-Scanner-Standalone-x64-${{ steps.version.outputs.version }}
          path: dist/ClamAV-Scanner-Standalone-x64.exe

  # Publishing is a separate job so the write-capable token is never available
  # to the build tooling above.
  publish:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The rolling tag is force-pushed from here, so git needs a credential
          # (the build job's checkout deliberately has none).
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          # Repeated from the build job on purpose: it is three lines, and this
          # way the publish job does not depend on an output crossing a job
          # boundary.
          $cargoToml = Get-Content "gui\Cargo.toml" -Raw
          if ($cargoToml -match 'version = "([^"]+)"') {
            $version = $matches[1]
          } else {
            $version = "0.0.0"
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "build=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Download the packaged artifacts
        uses: actions/download-artifact@v4
        with:
          # Both artifacts are unrolled flat into dist/, which is where the
          # release step below expects to find them.
          pattern: ClamAV-*
          path: dist
          merge-multiple: true
      - name: Prune every other tag and release
        if: github.event_name != 'pull_request' && github.event.inputs.create_release != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One release, one tag. Anything else is a leftover from the old
          # per-version scheme (v1.0.1 … v1.0.8), so it is deleted here together
          # with its attached archives. This is deliberate and irreversible:
          # those downloads no longer exist after this step runs.
          $keep = $env:RELEASE_TAG

          gh release list --limit 200 --json tagName --jq '.[].tagName' | ForEach-Object {
            $tag = $_.Trim()
            if ($tag -and $tag -ne $keep) {
              Write-Host "Deleting release and tag: $tag"
              gh release delete $tag --yes --cleanup-tag
            }
          }

          # Tags that never had a release, or were left behind by a failed run.
          git fetch --tags --force
          git tag --list | ForEach-Object {
            if ($_ -ne $keep) {
              Write-Host "Deleting stray tag: $_"
              git push origin --delete $_ 2>$null
              git tag --delete $_ 2>$null
            }
          }

          Write-Host "Remaining releases:"
          gh release list --limit 200
        shell: pwsh

      - name: Drop the previous release for this tag
        if: github.event_name != 'pull_request' && github.event.inputs.create_release != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Removing it first means the publish below always *creates* a release
          # rather than updating one, so the assets can never collide or go
          # stale, and the tag is moved to this build.
          gh release delete $env:RELEASE_TAG --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No existing '$env:RELEASE_TAG' release; nothing to drop."
          }
        shell: pwsh
        continue-on-error: true

      - name: Move the rolling tag
        if: github.event_name != 'pull_request' && github.event.inputs.create_release != 'false'
        # Best effort on purpose. Moving the tag is cosmetic: the release below is
        # identified by the fixed tag name, and the permanent download URLs go
        # through /releases/latest, which resolves by release date rather than by
        # tag. Run #38 failed on this step and skipped the release entirely after
        # half an hour of building, so a rejected tag push is now reported as a
        # warning instead of blocking publication. The release action creates the
        # tag at this commit when it is missing.
        continue-on-error: true
        run: |
          Write-Host "remote: $(git remote get-url origin)"
          Write-Host "local tags: $(git tag --list | Select-Object -First 20)"
          git tag -f $env:RELEASE_TAG
          git push --force origin $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::无法推送标签 $env:RELEASE_TAG，改由发布步骤创建（不影响下载）"
          } else {
            Write-Host "Tag $env:RELEASE_TAG now points at $(git rev-parse HEAD)"
          }
        shell: pwsh

      - name: Publish the rolling release
        if: github.event_name != 'pull_request' && (github.event.inputs.create_release == 'true' || github.event.inputs.create_release == '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ClamAV GUI ${{ steps.version.outputs.version }} · 最新版（build ${{ steps.version.outputs.build }}）
          files: |
            dist/ClamAV-GUI-Portable-x64.zip
            dist/ClamAV-Scanner-Standalone-x64.exe
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## ClamAV Windows x64 GUI · 最新版

            这是本项目**唯一**的发布：标签固定为 `latest`，每次构建都会覆盖本页的
            安装包与说明，所以下载地址永远不变（固定链接见下）。历史版本不再保留。

            - 固定下载（永久有效）：
              `https://github.com/${{ github.repository }}/releases/latest/download/ClamAV-GUI-Portable-x64.zip`
              `https://github.com/${{ github.repository }}/releases/latest/download/ClamAV-Scanner-Standalone-x64.exe`

            ### 📦 下载
            - **便携版**: ClamAV-GUI-Portable-x64.zip（解压即用）
            - **单文件版**: ClamAV-Scanner-Standalone-x64.exe（内嵌全部依赖，首次启动自动释放）

            ### ✨ 功能特性
            - 🎨 类纸风格界面：暖白纸面 / 深色墨板两套配色，矢量图标与纸张纹理
            - 🔍 快速扫描、全盘扫描与自定义目标（支持拖放文件）
            - 💿 按磁盘类型识别本地磁盘，自动跳过可移动介质
            - 🛡️ 实时保护（YAMAGoya ETW 行为监控，基于 Sigma/YAML/YARA 规则）
            - 🔄 病毒库在线更新（可取消，实时显示下载进度）
            - 🔒 威胁隔离区：单项恢复 / 删除，支持筛选
            - 📊 总览面板：威胁、扫描统计、病毒库版本与实时保护状态
            - ⚙️ 扫描预设（快速 / 均衡 / 彻底）与正则排除规则

            ### 🚀 性能
            - 日志视图按需绘制（虚拟滚动），十万行日志与十行开销相同
            - 按界面状态自适应重绘，空闲时不再持续占用 CPU
            - 扫描进度合并上报，避免逐文件刷新界面
            - 可选的多进程并行扫描（默认关闭：每个进程会各自加载一份病毒库）

            ### 🐛 最近修复
            - 每个页面都需要向下滚动：页头右上角操作区按整页高度居中，页头被撑到
              409px；现在七个页面都正好填满窗口，底部不再留空白
            - 隔离区 / 日志等空状态改为整页卡片承载提示，不再有大片空白
            - 报错信息不再输出完整本地路径（曾泄露账号名与目录结构）
            - 中文界面此前因未加载任何 CJK 字体而显示为方块
            - 病毒库 `GiB`/`KiB` 单位被当作 `MB` 解析，体积显示偏差可达 1024 倍
            - 扫描设置中的「邮件 / Office / PDF / HTML / 启发式」选项此前从未传给扫描引擎
            - 默认排除规则是无效正则（`target\debug` 中的 `\d` 会匹配数字）
            - 长中文路径截断时会 panic（按字节切分导致越界）
            - 系统托盘创建失败时关闭窗口会导致程序无法再打开
            - 关闭到托盘后窗口被真正隐藏，winit 会在不可见窗口上空转：实测 10 秒
              烧掉 9.66 秒 CPU（约一个核心的 97%），且窗口不再进入渲染循环；现在改为
              最小化到托盘，后台常驻实测 0.00% CPU，托盘菜单依然可用
            - 托盘常驻时再次双击程序只会弹出「已在运行」对话框并留下第二个进程；
              现在改为唤醒已有窗口，新进程立即退出，进程数始终为 1
            - Windows 已回收的 PID 可能被误杀（现在会校验进程映像路径）
            - 退出时后台实时保护可能来不及停止
            - 旧版配置文件会丢失 YAMAGoya 路径
            - 程序此前总是请求管理员权限，且该请求与工具链自带清单冲突；现在改为按需提权
            - 「扫描后自动隔离」此前默认开启：扫描一结束就把全部检出文件移入隔离区，
              连启发式误报也不会过问；现在默认关闭，需要时可在「设置」中开启
            - 隔离区单项删除此前单击即永久删除；现在与「清空隔离区」一样需要二次确认
            - 恢复隔离文件时，若原位置已存在同名文件（例如用户重新下载了同名程序），
              此前会被静默覆盖；现在会拒绝恢复并提示先移走该文件
            - 停止实时保护时，若无法读取进程映像，此前会退回到 pid 文件里记录的字符串
              来判断身份（该文件可被改写）；现在直接拒绝终止，不再误杀其它进程
            - 每次启动都会往 `logs\launch.log` 追加一行（时间、pid、父进程、判定结果），
              再出现「自己多开」时可以直接查出是双击、脚本还是计划任务拉起的
            - 唯一可能真正多开的情况（命名互斥体创建失败时此前会不带任何守卫继续启动）
              现在回退到独占锁文件，第二个实例会被拒绝
            - 配置写盘不再先删除旧文件：此前若在删除与重命名之间崩溃或重命名失败，
              用户的全部设置会丢失
            - 每次提交都会自动运行格式检查 / clippy（警告即错误）/ 单元测试；
              发布工作流中编译、下载第三方依赖的构建任务改为只读令牌，仓库写权限
              仅保留给最后的发布任务

            ### 📝 使用说明
            1. 解压到任意目录
            2. 运行 `ClamAV-Scanner.exe`
            3. 首次使用建议先更新病毒库
            4. 需要扫描或隔离 `C:\Windows` 下的受保护位置时，请在「设置」中点击
               **以管理员身份重启**

            ### 🔧 系统要求
            - Windows 10/11 x64
            - 单文件版首次启动会释放内置组件，需要数秒

